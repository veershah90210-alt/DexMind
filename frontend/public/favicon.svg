<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Ring (Pokédex Sensor Bezel) -->
  <circle cx="32" cy="32" r="30" fill="#0f1420" stroke="#ef4444" stroke-width="3"/>
  <circle cx="32" cy="32" r="24" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
  <!-- Optical Core Lens -->
  <circle cx="32" cy="32" r="18" fill="url(#lensGrad)"/>
  <!-- Glowing Center Diode -->
  <circle cx="32" cy="32" r="8" fill="#38bdf8"/>
  <circle cx="30" cy="29" r="3" fill="#ffffff" fill-opacity="0.9"/>
  <!-- Status Lights -->
  <circle cx="16" cy="14" r="3" fill="#ef4444"/>
  <circle cx="23" cy="14" r="2" fill="#f59e0b"/>
  <circle cx="29" cy="14" r="2" fill="#10b981"/>
  <defs>
    <radialGradient id="lensGrad" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
  </defs>
</svg>